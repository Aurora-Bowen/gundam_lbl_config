  # akima, not catmull-rom, and it is not a preference. This is the one dial
  # whose knots are not evenly spaced: its low tweak sits at -0.9 sigma rather
  # than -1, so the knots are 0.0111, 0.4515, 1.002, 1.5525, 2.103 - a first gap
  # of 0.4404 and then 0.5505 three times.
  #
  # Catmull-rom cannot represent that. DialCollection.cpp:1122-1150 always builds
  # a CompactSpline for it, and CompactSpline stores only the first knot and one
  # spacing, so it evaluates the curve as though every knot were evenly spaced.
  # With the default tolerance it prints the mismatch and carries on anyway,
  # which means a silently wrong response - and CompactSpline.cpp:51-57 aborts
  # instead on a release build.
  #
  # akima falls to the general branch, which checks the spacing and picks
  # GeneralSpline for non-uniform knots. Like catmull-rom it takes its slopes
  # from neighbouring points rather than from a global end condition, so it is
  # the closest equivalent that stores the knot positions.
  - name: "PionFSI_InelProb"
    isEnabled: true
    dialSetDefinitions:
      - dialType: Spline
        options: akima
        treeExpression: "PionFSI_InelProb"
        applyOnDataSets: [ "HK" ]

  - name: "SRCFrac_O"
